{% set name = "transformers" %}
{% set version = "5.20.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/huggingface/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 4b8f798661eff4aa6fbc87a6b1a6d03db30fa681fccb08b0c7afe64d47324fba

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - transformers=transformers.cli.transformers:main
  skip: true  # [py<310 or py>314]

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python
    - huggingface_hub >=1.31.0,<3.0
    - numpy >=1.17
    - packaging >=20.0
    - pyyaml >=5.1
    - regex >=2025.10.22
    # CLI chat module imports requests unconditionally (loaded by `transformers --help`);
    # not in upstream install_requires — it used to arrive via huggingface_hub<1.31 (now httpx).
    - requests
    - safetensors >=0.8.0
    - tokenizers >=0.23.1,<0.24.0
    - tqdm >=4.60
    - typer
  run_constrained:
    # Shared pinnings (avoid build errors due to duplicates):
    # torch, serving:
    - pytorch >=2.6
    # torch, accelerate, deepspeed, serving:
    - accelerate >=1.1.0
    # kernels, integrations:
    - kernels >=0.17.2,<0.18
    # integrations, codecarbon:
    - codecarbon >=2.8.1
    # integrations, ray:
    # ray[tune] and sudachipy/sudachidict_core are added upstream only for Python <3.14 (setup.py)
    - ray-tune >=2.7.0  # [py<314]

    # Unique pinnings
    # vision:
    - pillow >=10.0.1,<=15.0
    # audio:
    - pyctcdecode >=0.4.0
    # timm:
    - timm >=1.0.23
    # sentencepiece:
    - sentencepiece >=0.1.91,!=0.1.92
    # mistral-common:
    - mistral-common >=1.11.7
    # chat_template:
    - jinja2 >=3.1.0
    # retrieval
    - datasets >=2.15.0
    # sagemaker:
    - sagemaker >=2.31.0
    # deepspeed:
    - deepspeed >=0.9.3
    # serving:
    - openai >=1.98.0
    - pydantic >=2
    # ja(Japanese):
    - fugashi >=1.0
    - ipadic >=1.0.0,<2.0
    - unidic-lite >=1.0.7
    - unidic >=1.0.2
    - rhoknp >=1.1.0,<1.3.1
    - sudachipy >=0.6.6  # [py<314]
    - sudachidict-core >=20220729  # [py<314]

test:
  source_files:
    # Whole tree required: tests call direct_transformers_import() which reads src/transformers,
    # and import root helpers from utils/ — narrowing the copy breaks collection.
    - .
  imports:
    - transformers
    - transformers.activations
    - transformers.audio_utils
    - transformers.cache_utils
    - transformers.cli
    - transformers.configuration_utils
    - transformers.convert_slow_tokenizer
    - transformers.generation
    - transformers.image_processing_base
    - transformers.image_processing_utils_fast
    - transformers.image_utils
    - transformers.models
    - transformers.pipelines
    - transformers.processing_utils
    - transformers.tokenization_utils
    - transformers.tokenization_utils_base
    - transformers.tokenization_utils_fast
    - transformers.utils
  requires:
    - pip
    # to satisfy `transformers --help` because it raises a warning of missing pytorch/tensorflow for models.
    - pytorch
    # Tests load vision models (aria) + the Trainer, so the test env needs
    # torchvision and accelerate. Both are optional for end users: accelerate is bounded
    # in run_constrained above; torchvision's upstream `vision` extra is unversioned, so a
    # run_constrained entry would be a no-op — it stays test-only.
    - torchvision
    - accelerate >=1.1.0
    # PBP is using the GPU version for some reason:
    - bs4
    # NLTK recent 3.9 release breaks FastSpeechConformer2 tests,
    # see https://github.com/huggingface/transformers/pull/33301
    - nltk <=3.8.1
    # older parameterized breaks pytest collection on .expand (upstream setup.py)
    - parameterized >=0.9
    - psutil
    - pydantic >=2
    # Serving deps (pydantic/fastapi/uvicorn/openai): the serve CLI imports them lazily behind
    # is_serve_available(), so they are only needed here for the tests/cli serve tests.
    # They stay optional (run_constrained) for end users.
    - openai >=1.98.0
    - fastapi
    - uvicorn
    - pytest >=7.2.0,<9.0.0
    # NetworkDebugPlugin registers the xdist hook pytest_configure_node;
    # without pytest-xdist installed, pytest rejects it (PluginValidationError) at collection
    - pytest-xdist
    # pytest plugins from upstream's testing extra so marked tests actually run
    # (pytest-asyncio esp.: async tests silently no-op without it)
    - pytest-asyncio >=1.2.0
    - pytest-timeout
    - sentencepiece >=0.1.91,!=0.1.92
    - rich
    - datasets
  # Undeclared as testing deps
    - pillow
    - protobuf
  commands:
    - export PYTORCH_ENABLE_MPS_FALLBACK=1  # [osx]
    - pip check
    - transformers --help
    # Ignoring tests in all subdirectories.
    {% set ignore_tests = "" %}
    # conftest_tests/ (new in 5.14.1) meta-tests HF's repo-root conftest.py CI cache-fallback
    # harness; pytest resolves `conftest` to tests/cli/conftest.py here, so the patched
    # _ci_fallback_cache_dir attribute is absent (AttributeError). Tests the CI harness, not transformers.
    {% set ignore_tests = ignore_tests + " --ignore=tests/conftest_tests" %}
    {% set ignore_tests = ignore_tests + " --ignore=tests/fixtures" %}
    {% set ignore_tests = ignore_tests + " --ignore=tests/generation" %}
    {% set ignore_tests = ignore_tests + " --ignore=tests/models" %}
    {% set ignore_tests = ignore_tests + " --ignore=tests/peft_integration" %}
    {% set ignore_tests = ignore_tests + " --ignore=tests/pipelines" %}
    {% set ignore_tests = ignore_tests + " --ignore=tests/quantization" %}
    {% set ignore_tests = ignore_tests + " --ignore=tests/repo_utils" %}
    {% set ignore_tests = ignore_tests + " --ignore=tests/sagemaker" %}
    {% set ignore_tests = ignore_tests + " --ignore=tests/tensor_parallel" %}  #  [win or osx]
    # New in 5.20.0: tests/distributed spawns 4 gloo ranks (mp.spawn) to reshard TP/FSDP checkpoints
    # via DTensor. Passes on linux/osx CPU; Windows unverified, excluded like tests/tensor_parallel.
    {% set ignore_tests = ignore_tests + " --ignore=tests/distributed" %}  #  [win]
    {% set ignore_tests = ignore_tests + " --ignore=tests/tokenization" %}
    {% set ignore_tests = ignore_tests + " --ignore=tests/trainer" %}
    {% set ignore_tests = ignore_tests + " --ignore=tests/utils" %}
    # Windows CI: see test_executorch reason below
    {% set ignore_tests = ignore_tests + " --ignore=tests/test_pipeline_mixin.py" %}  # [win]
    # [Windows] Upstream bug where non-CUDA machines (CI) fail to correctly skip CUDA test on Windows
    # fatal exception: access violation
    {% set ignore_tests = ignore_tests + " --ignore=tests/test_executorch.py" %}  # [win]
    # Tests require mistral-common >=1.11.7; pkgs/main currently provides only <=1.11.6.
    {% set ignore_tests = ignore_tests + " --ignore=tests/test_tokenization_mistral_common.py" %}

    # Audio-pipeline tests: recent transformers decodes audio via torchcodec (ImportError without it).
    # torchcodec on pkgs/main hard-pins `pytorch 2.11 *cpu*`, which conflicts with the test env's
    # resolved pytorch; TokenClassificationPipelineTests::test_chunking_fast additionally fails a CPU
    # device-expectation check. Re-enable under a dedicated ticket once the torchcodec/pytorch pin is sorted.
    {% set skip_tests = "return_timestamps_ctc_fast" %}
    {% set skip_tests = skip_tests + " or chunking_fast" %}
    {% set skip_tests = skip_tests + " or input_parameter_passthrough" %}
    {% set skip_tests = skip_tests + " or pipeline_assisted_generation" %}
    {% set skip_tests = skip_tests + " or test_return_timestamps_ctc_fast" %}
    {% set skip_tests = skip_tests + " or test_pipeline_generation_kwargs" %}
    # Requires cxx compiler
    {% set skip_tests = skip_tests + " or test_model_generate" %}
    # New in 5.15.0: kernel-loader *_is_compile_safe tests (deepgemm/finegrained_fp8/sonicmoe)
    # call torch._inductor, which needs a working C++ compiler on PATH. The pure-Python test env
    # has no gxx (torch's TORCH_INDUCTOR_INSTALL_GXX self-install is off) — same class as test_torch_compile_fullgraph.
    {% set skip_tests = skip_tests + " or is_compile_safe" %}
    # Tensorboard install conflicts
    {% set skip_tests = skip_tests + " or test_word_heuristic_leading_space" %}

    # Small floating point rounding errors.
    {% set skip_tests = skip_tests + " or small_model_pt" %}
    {% set skip_tests = skip_tests + " or small_model_pt_fp16" %}
    {% set skip_tests = skip_tests + " or small_model_pt_seq2seq" %}
    {% set skip_tests = skip_tests + " or torch_float16_pipeline" %}
    {% set skip_tests = skip_tests + " or return_dict_in_generate" %}
    {% set skip_tests = skip_tests + " or stop_sequence_stopping_criteria" %}
    # test_consistent_batching_behaviour downloads microsoft/kosmos-2-patch14-224 from HF Hub;
    # the download intermittently hits a brotlicffi 1.2.0.0 decoder bug in httpx (DecodingError →
    # tokenizer load OSError), failing across platforms. Not a packaging issue — skip everywhere.
    {% set skip_tests = skip_tests + " or consistent_batching_behaviour" %}

    # bf16/fp16 pipeline scores differ slightly on linux-aarch64 (osx-arm64 handled above)
    {% set skip_tests = skip_tests + " or torch_bfloat16_pipeline" %}  # [aarch64]
    {% set skip_tests = skip_tests + " or accepts_torch_fp16" %}  # [aarch64]

    # Require Mac OS 14
    {% set skip_tests = skip_tests + " or return_timestamps_in_init" %}  # [osx and arm64]
    {% set skip_tests = skip_tests + " or torch_bfloat16_pipeline" %}  # [osx and arm64]
    {% set skip_tests = skip_tests + " or pipeline_length_setting_warning" %}  # [osx and arm64]
    {% set skip_tests = skip_tests + " or small_chat_model_continue_final_message" %}  # [osx and arm64]
    {% set skip_tests = skip_tests + " or small_chat_model_continue_final_message_override" %}  # [osx and arm64]
    {% set skip_tests = skip_tests + " or small_chat_model_pt" %}  # [osx and arm64]
    {% set skip_tests = skip_tests + " or small_chat_model_with_dataset_pt" %}  # [osx and arm64]
    {% set skip_tests = skip_tests + " or small_chat_model_with_iterator_pt" %}  # [osx and arm64]

    # TokenClassificationPipelineTests::test_no_offset_tokenizer: CPU device-expectation gap
    # (ValueError: No matching expectation found for ('cpu', None, None)); fails on every Python
    # (py3.13/3.14 verified in PR #33 CI once test_pipeline_mixin ran there). Same class as chunking_fast.
    {% set skip_tests = skip_tests + " or test_no_offset_tokenizer" %}
    # TypeError: stat: path should be string, bytes, os.PathLike or integer, not NoneType
    {% set skip_tests = skip_tests + " or test_pipeline_length_setting_warning" %}  # [py<313]
    # Needs authentification to https://huggingface.co/google/gemma-3-270m-it: 401 Client Error
    {% set skip_tests = skip_tests + " or test_pipeline_skip_special_tokens" %}
    # Module not found "phonemizer"
    {% set skip_tests = skip_tests + " or test_forward_model_kwargs" %}
    # ValueError: I/O operation on closed file.
    {% set skip_tests = skip_tests + " or test_cli_download" %}
    # TypeError: iteration over a 0-d array
    {% set skip_tests = skip_tests + " or test_slow_tokenizer_sqa_pt" %}
    # problematic compatibility with pytorch 2.8 on osx-metal (GPU). Higher pytorch versions available for
    # python 3.12 and up. Skipping those tests is more reasonable than switching to CPU.
    {% set skip_tests = skip_tests + " or test_forward_tokenizer_kwargs" %}  # [osx and py<312]
    {% set skip_tests = skip_tests + " or test_generative_model_kwargs" %}  # [osx and py<312]

    - pytest tests -k "not ({{ skip_tests }})" {{ ignore_tests }}

about:
  home: https://github.com/huggingface/transformers
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: model-definition framework for state-of-the-art machine learning models in text, vision, audio, and multimodal models, for both inference and training.
  description: |
    Transformers provides thousands of pretrained models to perform tasks on different modalities such as text, vision, and audio.

    These models can be applied on:

    - 📝 Text, for tasks like text classification, information extraction, question answering, summarization, translation, text generation, in over 100 languages.
    - 🖼️ Images, for tasks like image classification, object detection, and segmentation.
    - 🗣️ Audio, for tasks like speech recognition and audio classification.

    Transformer models can also perform tasks on several modalities combined, such as table question answering, optical character recognition, information extraction from scanned documents, video classification, and visual question answering.
  doc_url: https://huggingface.co/docs/transformers/index
  dev_url: https://github.com/huggingface/transformers

extra:
  recipe-maintainers:
    - mxr-conda
    - roccqqck
    - oblute
    - rluria14
    - ndmaxar
    - setu4993
    - hadim
    - wietsedv
